# Builds the unsigned Android app (APK + AAB) from twa/twa-manifest.json. Signing happens off CI with the upload key,
# which is never stored here.
name: apk
on:
  workflow_dispatch:
  push:
    branches: [main-y500hu]
    paths: ['.github/workflows/apk.yml', 'twa/twa-manifest.json', 'tools/twa-gen.mjs']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Generate the Android project
        run: npm i --no-save @bubblewrap/core && node tools/twa-gen.mjs twa/twa-manifest.json build-twa
      - name: Build
        run: |
          cd build-twa && chmod +x gradlew && ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Align and collect
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir out
          "$BT/zipalign" -p -f 4 build-twa/app/build/outputs/apk/release/app-release-unsigned.apk out/sohrai-unsigned-aligned.apk
          cp build-twa/app/build/outputs/bundle/release/app-release.aab out/sohrai-unsigned.aab
          cp "$BT/lib/apksigner.jar" out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out, retention-days: 7 }
      # The cloud session that signs the app cannot download artifacts, so the unsigned output also goes to a branch.
      - name: Publish the unsigned build to the apk-build branch
        run: |
          cd out && git init -q -b apk-build && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "unsigned Android build of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-build
