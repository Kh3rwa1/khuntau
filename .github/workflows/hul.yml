# Hul has its own site: https://hul.dulalkisku0.workers.dev (Worker "hul", static files from hul/dist).
# On a change to Hul (or to the shared files it copies from public/), build it, play it in a headless browser
# against the built files, and on main deploy it and check the live address serves this build.
# Kept apart from Sohrai's "test and deploy" so neither can hold up or time out the other.
name: hul
on:
  push:
    branches: [main, 'main-*']
    paths: ['hul/**', 'tools/hul-build.mjs', 'tests/hul.mjs', 'tests/serve.mjs', 'tests/check.mjs', 'public/vendor/**', 'public/models/casual_*', 'public/audio/**', 'public/fonts/**', '.github/workflows/hul.yml']
  workflow_dispatch:
concurrency:
  group: hul-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SWGL: '1' # no GPU on the runner: software WebGL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node tools/hul-build.mjs
      - name: Play Hul (built site)
        run: |
          ROOT=hul/dist PORT=8792 node tests/serve.mjs &
          sleep 1
          npm run test:hul
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: hul-screenshots, path: tests/out, retention-days: 7 }
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node tools/hul-build.mjs
      - name: Deploy Hul to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::CLOUDFLARE_API_TOKEN secret not set: tests passed, nothing deployed."; exit 0; fi
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then echo "::notice::main is now at ${tip:0:7}; not deploying older code."; exit 0; fi
          npx wrangler deploy --config hul/wrangler.jsonc
      - name: Check the live address
        run: |
          want=$(sha256sum hul/dist/index.html | cut -c1-64)
          for i in $(seq 1 12); do
            got=$(curl -sf https://hul.dulalkisku0.workers.dev/ | sha256sum | cut -c1-64)
            [ "$got" = "$want" ] && break; sleep 5; done
          [ "$got" = "$want" ] || { echo "::error::live Hul page does not match this build"; exit 1; }
          for f in /models/casual_female.json /vendor/three/build/three.module.min.js /audio/r-twang.mp3 /fonts/rubik-dirt-latin.woff2; do
            curl -sf -o /dev/null https://hul.dulalkisku0.workers.dev$f || { echo "::error::live $f missing"; exit 1; }; done
          echo "Live: https://hul.dulalkisku0.workers.dev serves this build"
